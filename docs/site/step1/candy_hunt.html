<!-- 全画面ボタン（app2html の出力に手で足したもの） -->
<style>
  #fs-btn {
    position: fixed; right: 12px; bottom: 12px; z-index: 9999;
    padding: 8px 14px; font: 14px system-ui, sans-serif;
    color: #fff; background: rgba(40, 44, 60, .82);
    border: 1px solid #7d86a8; border-radius: 6px; cursor: pointer;
    opacity: .55; transition: opacity .15s;
  }
  #fs-btn:hover, #fs-btn:focus { opacity: 1; }

  /* 全画面のあいだはボタンを隠す（抜けるときは ESC） */
  :root:fullscreen #fs-btn { display: none; }
  :root:-webkit-full-screen #fs-btn { display: none; }
</style>
<button id="fs-btn" title="ゲーム画面をブラウザいっぱいに広げます（もどるときは ESC）">全画面</button>
<script>
const fsBtn = document.getElementById("fs-btn");

fsBtn.addEventListener("click", async () => {
  try {
    await document.documentElement.requestFullscreen();
  } catch (e) {
    console.log("[fs] 全画面にできませんでした:", e.name, e.message);
  }
  // クリックでボタンに移った入力先を、ゲーム画面へ戻す
  const canvas = document.getElementById("canvas");
  if (canvas) { canvas.focus(); }
});

// 全画面のあいだはボタンを隠す。ESC で抜けたら戻す
document.addEventListener("fullscreenchange", () => {
  fsBtn.hidden = !!document.fullscreenElement;
  const canvas = document.getElementById("canvas");
  if (canvas) { canvas.focus(); }
});
</script>
